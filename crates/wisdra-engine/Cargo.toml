[package]
name = "wisdra-engine"
description = "Wisdra analysis engines: native PE/ELF/Mach-O triage and Ghidra headless orchestration."
readme = "../../README.md"
keywords = ["malware-analysis", "reverse-engineering", "ghidra", "yara", "forensics"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wisdra-model = { path = "../wisdra-model" }
anyhow = "1"
goblin = "0.10"
hex = "0.4"
md-5 = "0.10"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
walkdir = "2.5"

# Windows API for live memory scanning (Windows-only feature)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
] }
