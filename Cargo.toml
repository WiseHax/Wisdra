[workspace]
members = [
    "wisdra_core",
    "ExposureZ3"
]

[package]
name = "wisdra"
version = "0.1.0"
edition = "2024"
authors = ["Wxse"]
description = "Wisdra — Next-generation automated malware analysis CLI. Orchestrates Ghidra's headless engine for rapid binary intelligence extraction."
license = "MIT"
readme = "README.md"
keywords = ["malware-analysis", "reverse-engineering", "ghidra", "cybersecurity", "binary-analysis"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI framework
clap = { version = "4", features = ["derive", "color", "env"] }

# Async runtime for process orchestration
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Terminal UI & styling
crossterm = "0.28"
ratatui = "0.29"
colored = "2"
indicatif = "0.17"

# Utilities
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
