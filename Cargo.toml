[workspace]
resolver = "3"
members = ["wisdra_core"]
# ExposureZ3 lives in its own repository (https://github.com/WiseHax/ExposureZ3)
# and is invoked as an optional external binary by `wisdra analyze --verify`.
exclude = ["ExposureZ3"]

[workspace.package]
version = "2.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Wxse"]
license = "MIT"
repository = "https://github.com/WiseHax/Wisdra"

# Profiles must live in the workspace root; cargo ignores them in members.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
